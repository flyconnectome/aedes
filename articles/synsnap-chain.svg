<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 345" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="800" height="345" fill="#fff"/>

  <!-- static data -->
  <rect x="20" y="15" width="760" height="78" rx="6" fill="#eef2f7" stroke="#8a9bb3"/>
  <text x="34" y="37" font-weight="bold">static.parquet</text>
  <text x="140" y="37" fill="#444">one row per synapse · fixed once synapses are detected · 1.7 GB</text>
  <g font-family="Menlo, monospace" font-size="12">
    <rect x="34" y="50" width="60" height="28" fill="#fff" stroke="#8a9bb3"/><text x="64" y="69" text-anchor="middle">id</text>
    <rect x="94" y="50" width="90" height="28" fill="#fff" stroke="#8a9bb3"/><text x="139" y="69" text-anchor="middle">pre_sv</text>
    <rect x="184" y="50" width="90" height="28" fill="#fff" stroke="#8a9bb3"/><text x="229" y="69" text-anchor="middle">post_sv</text>
    <rect x="274" y="50" width="170" height="28" fill="#fff" stroke="#8a9bb3"/><text x="359" y="69" text-anchor="middle">pre_x, pre_y, pre_z</text>
    <rect x="444" y="50" width="180" height="28" fill="#fff" stroke="#8a9bb3"/><text x="534" y="69" text-anchor="middle">post_x, post_y, post_z</text>
    <rect x="624" y="50" width="70" height="28" fill="#fff" stroke="#8a9bb3"/><text x="659" y="69" text-anchor="middle">size</text>
  </g>

  <!-- chain -->
  <g font-size="12">
    <rect x="20" y="120" width="160" height="120" rx="6" fill="#dcebdc" stroke="#5f8f5f" stroke-width="1.5"/>
    <text x="32" y="142" font-weight="bold" font-size="13">v518 · base</text>
    <text x="32" y="160" fill="#444">full snapshot</text>
    <text x="32" y="184" font-family="Menlo, monospace" font-size="11">by_pre.parquet</text>
    <text x="32" y="201" fill="#444">id, pre_root, post_root</text>
    <text x="32" y="217" fill="#444">for every synapse</text>
    <text x="32" y="233" fill="#444">0.55 GB</text>

    <rect x="220" y="120" width="160" height="120" rx="6" fill="#fdf1dc" stroke="#c49a4a" stroke-width="1.5"/>
    <text x="232" y="142" font-weight="bold" font-size="13">v519</text>
    <text x="232" y="160" fill="#444">checkpoint · version 519</text>
    <text x="232" y="184" font-family="Menlo, monospace" font-size="11">log.parquet</text>
    <text x="232" y="201" fill="#444">~300k changed synapses</text>
    <text x="232" y="233" fill="#444">~1 MB</text>

    <rect x="420" y="120" width="160" height="120" rx="6" fill="#fdf1dc" stroke="#c49a4a" stroke-width="1.5"/>
    <text x="432" y="142" font-weight="bold" font-size="13">r20261002T200000</text>
    <text x="432" y="160" fill="#444">checkpoint · 20:00 fallback</text>
    <text x="432" y="184" font-family="Menlo, monospace" font-size="11">log.parquet</text>
    <text x="432" y="201" fill="#444">no version on 2 Oct,</text>
    <text x="432" y="217" fill="#444">so made at 20:00</text>
    <text x="432" y="233" fill="#444">~1 MB</text>

    <rect x="620" y="120" width="160" height="120" rx="6" fill="#fdf1dc" stroke="#c49a4a" stroke-width="1.5"/>
    <text x="632" y="142" font-weight="bold" font-size="13">v521</text>
    <text x="632" y="160" fill="#444">checkpoint · version 521</text>
    <text x="632" y="184" font-family="Menlo, monospace" font-size="11">log.parquet</text>
    <text x="632" y="201" fill="#444">~300k changed synapses</text>
    <text x="632" y="233" fill="#444">~1 MB</text>
  </g>

  <!-- parent arrows (child -> parent) -->
  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M218,180 L183,180"/>
    <path d="M418,180 L383,180"/>
    <path d="M618,180 L583,180"/>
  </g>
  <g fill="#555" font-size="10" text-anchor="middle">
    <text x="200" y="172">parent</text>
    <text x="400" y="172">parent</text>
    <text x="600" y="172">parent</text>
  </g>

  <!-- time axis -->
  <path d="M20,270 L780,270" stroke="#999" stroke-width="1.5" marker-end="url(#a)"/>
  <g fill="#666" font-size="11" text-anchor="middle">
    <path d="M100,265 v10 M300,265 v10 M500,265 v10 M700,265 v10" stroke="#999"/>
    <text x="100" y="289">30 Sep 14:12</text>
    <text x="300" y="289">1 Oct 14:12</text>
    <text x="500" y="289">2 Oct 20:00</text>
    <text x="700" y="289">3 Oct 14:12</text>
  </g>
  <text x="20" y="316" fill="#444" font-size="12">Each checkpoint stores only the synapses whose root ids changed since its parent. There is one a day:</text>
  <text x="20" y="333" fill="#444" font-size="12">at each new materialisation version, or at 20:00 UTC on a day without one.</text>
</svg>
