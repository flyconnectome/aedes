<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5523b"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f7f4f"/>
    </marker>
  </defs>
  <rect width="800" height="470" fill="#fff"/>

  <!-- CAVE -->
  <rect x="20" y="20" width="180" height="420" rx="8" fill="#eef2f7" stroke="#8a9bb3" stroke-width="1.5"/>
  <text x="110" y="46" text-anchor="middle" font-weight="bold" font-size="15">CAVE</text>
  <g font-size="12" fill="#333">
    <text x="34" y="78">synapse table</text>
    <text x="34" y="94" fill="#666">111 M synapses</text>
    <text x="34" y="226">materialisation</text>
    <text x="34" y="242">versions</text>
    <text x="34" y="258" fill="#666">about one a day</text>
    <text x="34" y="350">chunkedgraph</text>
    <text x="34" y="366" fill="#666">root ids at any time,</text>
    <text x="34" y="382" fill="#666">edits as they happen</text>
  </g>

  <!-- your computer -->
  <rect x="580" y="20" width="200" height="420" rx="8" fill="#f6f6f6" stroke="#999" stroke-width="1.5"/>
  <text x="680" y="46" text-anchor="middle" font-weight="bold" font-size="15">Your computer</text>
  <rect x="596" y="62" width="168" height="62" rx="6" fill="#fff" stroke="#999"/>
  <text x="680" y="84" text-anchor="middle">R session</text>
  <text x="680" y="102" text-anchor="middle" font-size="11" font-family="Menlo, monospace">aedes_partner_summary()</text>
  <text x="680" y="116" text-anchor="middle" font-size="11" fill="#666">CAVE or local snapshot</text>
  <rect x="596" y="166" width="168" height="178" rx="6" fill="#dcebdc" stroke="#5f8f5f"/>
  <text x="680" y="190" text-anchor="middle" font-weight="bold">local snapshot</text>
  <text x="680" y="208" text-anchor="middle" font-size="12">parquet files + DuckDB</text>
  <text x="680" y="230" text-anchor="middle" font-size="12" fill="#2f5f2f">seconds for</text>
  <text x="680" y="246" text-anchor="middle" font-size="12" fill="#2f5f2f">thousands of neurons</text>
  <line x1="610" y1="262" x2="750" y2="262" stroke="#5f8f5f" stroke-dasharray="3 3"/>
  <text x="680" y="282" text-anchor="middle" font-size="11" font-family="Menlo, monospace">aedes_synapse_data()</text>
  <text x="680" y="300" text-anchor="middle" font-size="12">the whole synapse table:</text>
  <text x="680" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5f2f">only with a snapshot</text>
  <text x="680" y="332" text-anchor="middle" font-size="11" fill="#666">(no CAVE equivalent)</text>
  <path d="M680,164 L680,128" stroke="#4f7f4f" stroke-width="2" fill="none" marker-end="url(#g)"/>

  <!-- lab server -->
  <rect x="270" y="170" width="190" height="180" rx="8" fill="#fdf1dc" stroke="#c49a4a" stroke-width="1.5"/>
  <text x="365" y="196" text-anchor="middle" font-weight="bold" font-size="15">Lab server</text>
  <text x="365" y="214" text-anchor="middle" font-size="11" fill="#666">checks CAVE every hour</text>
  <g font-size="12">
    <text x="282" y="242">• full snapshot, built once</text>
    <text x="282" y="262">• one small checkpoint a</text>
    <text x="294" y="278">day, at each new version</text>
    <text x="282" y="298">• publishes them</text>
    <text x="294" y="314">over https</text>
  </g>

  <!-- direct query -->
  <text x="390" y="72" text-anchor="middle" font-weight="bold" fill="#b5523b">Direct CAVE query</text>
  <path d="M594,93 L204,93" stroke="#b5523b" stroke-width="2" fill="none" marker-end="url(#r)" marker-start="url(#r)"/>
  <text x="390" y="114" text-anchor="middle" font-size="12" fill="#b5523b">every query fetches synapses and looks up root ids</text>
  <text x="390" y="130" text-anchor="middle" font-size="12" fill="#b5523b">fine for a few neurons; slow for many, or for "now"</text>

  <!-- snapshot path -->
  <path d="M204,250 L266,250" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="235" y="240" text-anchor="middle" font-size="11" fill="#555">edits</text>
  <path d="M464,250 L592,250" stroke="#4f7f4f" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="526" y="226" text-anchor="middle" font-size="11" fill="#2f5f2f">2.3 GB once,</text>
  <text x="526" y="240" text-anchor="middle" font-size="11" fill="#2f5f2f">then ~1 MB/day</text>
  <text x="526" y="268" text-anchor="middle" font-size="11" fill="#2f5f2f">automatic</text>

  <!-- now: only recent edits -->
  <path d="M204,395 L680,395 L680,348" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/>
  <text x="390" y="388" text-anchor="middle" font-size="12" fill="#444">for "now": only the edits since the newest snapshot</text>
  <text x="390" y="415" text-anchor="middle" font-size="11" fill="#666">usually seconds</text>
</svg>
