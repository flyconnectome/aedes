<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8466a8"/>
    </marker>
  </defs>
  <rect width="800" height="330" fill="#fff"/>
  <text x="20" y="24" font-weight="bold">Answering a query for a time T after the newest snapshot</text>

  <!-- published chain -->
  <g font-size="12">
    <rect x="20" y="45" width="120" height="70" rx="6" fill="#dcebdc" stroke="#5f8f5f" stroke-width="1.5"/>
    <text x="32" y="67" font-weight="bold" font-size="13">v518 · base</text>
    <text x="32" y="85" fill="#444">full snapshot</text>
    <text x="32" y="103" fill="#444">published</text>

    <rect x="170" y="45" width="120" height="70" rx="6" fill="#fdf1dc" stroke="#c49a4a" stroke-width="1.5"/>
    <text x="182" y="67" font-weight="bold" font-size="13">… v521</text>
    <text x="182" y="85" fill="#444">checkpoints</text>
    <text x="182" y="103" fill="#444">published</text>

    <rect x="320" y="45" width="120" height="70" rx="6" fill="#fdf1dc" stroke="#c49a4a" stroke-width="1.5"/>
    <text x="332" y="67" font-weight="bold" font-size="13">v522</text>
    <text x="332" y="85" fill="#444">newest published</text>
    <text x="332" y="103" fill="#444">checkpoint</text>
  </g>
  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M168,80 L143,80"/>
    <path d="M318,80 L293,80"/>
  </g>

  <!-- in-memory head -->
  <rect x="520" y="40" width="260" height="95" rx="6" fill="#ece4f5" stroke="#8466a8" stroke-width="1.5" stroke-dasharray="6 3"/>
  <g font-size="12">
    <text x="532" y="62" font-weight="bold" font-size="13">in-memory head at T</text>
    <text x="532" y="80" fill="#444">synapses on neurons edited since v522,</text>
    <text x="532" y="96" fill="#444">root ids looked up in CAVE at T</text>
    <text x="532" y="112" fill="#444">kept for this R session only;</text>
    <text x="532" y="128" fill="#444">reused for queries up to a minute later</text>
  </g>
  <path d="M518,80 L443,80" stroke="#8466a8" stroke-width="1.5" fill="none" marker-end="url(#p)"/>
  <text x="480" y="72" fill="#8466a8" font-size="10" text-anchor="middle">starts from</text>

  <!-- local checkpoint -->
  <rect x="320" y="160" width="190" height="62" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g font-size="12">
    <text x="332" y="180" font-weight="bold" font-size="13">local checkpoint</text>
    <text x="332" y="197" fill="#444">aedes_update_snapshot()</text>
    <text x="332" y="213" fill="#444">used only at its own time</text>
  </g>
  <path d="M380,158 L380,118" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="386" y="142" fill="#555" font-size="10">parent</text>
  <path d="M600,137 L514,180" stroke="#b55" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <path d="M551,152 l10,10 m0,-10 l-10,10" stroke="#b55" stroke-width="2"/>
  <text x="572" y="170" fill="#b55" font-size="11">never a starting point</text>
  <text x="572" y="184" fill="#b55" font-size="11">for a later time</text>

  <!-- time axis -->
  <path d="M20,250 L780,250" stroke="#999" stroke-width="1.5" marker-end="url(#a)"/>
  <g fill="#666" font-size="11" text-anchor="middle">
    <path d="M80,245 v10 M230,245 v10 M380,245 v10 M440,245 v10 M690,245 v10" stroke="#999"/>
    <text x="80" y="269">30 Sep</text>
    <text x="230" y="269">3 Oct</text>
    <text x="380" y="269">4 Oct 14:12</text>
    <text x="455" y="283">5 Oct 10:15</text>
    <text x="690" y="269" font-weight="bold" fill="#8466a8">T (e.g. "now")</text>
  </g>
  <text x="20" y="306" fill="#444" font-size="12">Downloaded (published) snapshots form the chain. Times after the newest one are answered in memory from the</text>
  <text x="20" y="323" fill="#444" font-size="12">CAVE edits since then. Your own local checkpoints are only used for exactly their own time.</text>
</svg>
